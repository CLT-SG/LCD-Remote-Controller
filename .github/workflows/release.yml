name: Release

# Cross-platform release pipeline for the CLT LCD Remote Controller.
#
# Triggers
# --------
# * push of a `v*` tag (e.g. `v1.0.5`)  -> builds Linux, Windows and macOS
#   bundles and publishes them to a draft GitHub Release.
# * manual dispatch                     -> builds the same matrix without
#   publishing, useful for verifying a branch.
#
# Why a matrix?
# -------------
# Tauri does not cross-compile: each OS must build on a runner of that OS
# because the bundler links against the host WebView and uses the host's
# native installer tooling (WiX/NSIS on Windows, dpkg/rpm/AppImage on
# Linux, hdiutil/codesign on macOS).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # required by tauri-action to create / update releases

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            tauri-args: ""
          - name: windows
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: ""
          - name: macos
            os: macos-latest
            rust-target: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust-target }}

      - name: Cache Cargo registry & build artefacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform.name }}

      - name: Install Linux build dependencies
        if: matrix.platform.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install npm dependencies
        run: npm ci

      - name: Build and bundle the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only attach to a release when this run was triggered by a tag.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "CLT LCD Remote Controller ${{ github.ref_name }}"
          releaseBody: |
            Automated multi-platform build.
            See `CHANGELOG.md` for the list of changes.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.tauri-args }}

      - name: Upload bundle as workflow artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clt-lcd-remote-controller-${{ matrix.platform.name }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/*/release/bundle/**/*
